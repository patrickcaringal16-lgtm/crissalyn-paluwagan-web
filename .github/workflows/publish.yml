name: Deploy CRISSALYN PALUWAGAN iPhone PWA
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "crissalyn-github-pages"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public static app files
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Stage only production static assets
        run: |
          set -euo pipefail
          mkdir -p site
          cp -- index.html app.js security.js styles.css elite.css sw.js manifest.webmanifest icon.svg icon-192.png icon-512.png apple-touch-icon.png robots.txt site/
          touch site/.nojekyll
          test -s site/index.html && test -s site/manifest.webmanifest
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
